<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Team DTK</title><link rel="stylesheet" href="/style.css">
</head><body>
<div class="wrap" id="wrap">
  <div class="logo">TEAM DTK · ADMIN</div>

  <div class="card" id="login">
    <h1>Panel admin</h1>
    <p class="sub">Entre le mot de passe administrateur.</p>
    <input id="pw" type="password" placeholder="Mot de passe">
    <button id="enter">Connexion</button>
    <div class="err" id="lerr"></div>
  </div>

  <div class="card hidden" id="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h1 style="margin:0">Codes</h1>
      <button class="ghost sm" id="logout">Déconnexion</button>
    </div>

    <div id="reqs"></div>

    <h2 class="sec">Ajouter un code</h2>
    <div class="row">
      <input id="ncode" inputmode="numeric" maxlength="8" placeholder="Code (8 chiffres)">
      <input id="nname" placeholder="Nom">
      <input id="nrole" placeholder="Rôle (ex : MEMBRE)">
      <button id="add">Ajouter</button>
    </div>
    <div class="err" id="perr"></div>

    <table>
      <thead><tr><th>Code</th><th>Nom</th><th>Rôle</th><th>Carte</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="mbox">
    <img id="big" alt="">
    <div class="mbtns">
      <button class="sm" id="mdl">Télécharger</button>
      <button class="ghost sm" id="mcp">Copier</button>
      <button class="ghost sm" id="mcl">Fermer</button>
    </div>
  </div>
</div>

<input type="file" id="file" class="hidden" accept=".png,.jpg,.jpeg,.webp,.pdf">
<script>
const $=id=>document.getElementById(id);
let PW=sessionStorage.getItem('dtk_pw')||'';
let uploadFor=null;
let REQS=[];

const api=(url,opt={})=>fetch(url,{...opt,headers:{'Content-Type':'application/json','x-admin-password':PW,...(opt.headers||{})}});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){
  const r=await api('/api/admin/codes');
  if(r.status===401){sessionStorage.removeItem('dtk_pw');PW='';show(false);return false;}
  const list=await r.json();
  $('rows').innerHTML=list.map(m=>`<tr>
    <td style="font-family:ui-monospace,monospace">${esc(m.code)}</td>
    <td>${esc(m.name)}</td><td>${esc(m.role)}</td>
    <td>${m.file?`<span class="ok">✓</span> <span class="tag">${esc(m.file.name)}</span>`:'<span class="tag">aucune</span>'}</td>
    <td class="act">
      <button class="ghost sm" data-up="${m.code}">${m.file?'Remplacer':'Ajouter carte'}</button>
      ${m.file?`<button class="ghost sm" data-rmf="${m.code}">Retirer carte</button>`:''}
      <button class="danger sm" data-del="${m.code}">Supprimer</button>
    </td></tr>`).join('');
  loadReqs();
  return true;
}
function show(on){$('login').classList.toggle('hidden',on);$('panel').classList.toggle('hidden',!on);$('wrap').classList.toggle('wide',on);}

$('enter').onclick=async()=>{
  PW=$('pw').value;$('lerr').textContent='';
  if(await load()){sessionStorage.setItem('dtk_pw',PW);show(true);}
  else $('lerr').textContent='Mot de passe incorrect.';
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click();});
$('logout').onclick=()=>{sessionStorage.removeItem('dtk_pw');PW='';show(false);};

$('add').onclick=async()=>{
  $('perr').textContent='';
  const body={code:$('ncode').value,name:$('nname').value,role:$('nrole').value||'MEMBRE'};
  const r=await api('/api/admin/codes',{method:'POST',body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){$('perr').textContent=d.error;return;}
  $('ncode').value=$('nname').value=$('nrole').value='';load();
};

/* ---------- Demandes ---------- */
async function loadReqs(){
  const r=await api('/api/admin/requests');
  if(!r.ok)return;
  REQS=await r.json();
  const fd=d=>d.split('-').reverse().join('/');
  const pend=REQS.filter(q=>q.status==='pending').length;
  $('reqs').innerHTML=REQS.length?`<h2 class="sec">Demandes de carte${pend?` (${pend} en attente)`:''}</h2>`+REQS.map(q=>`
    <div class="req">
      <img src="${esc(q.photo)}" alt="" data-view="${q.id}">
      <div class="info">
        <b>${esc(q.prenom)} ${esc(q.nom)}</b>
        ${q.status==='approved'?`<span class="pill g">ACCEPTÉE</span>`:`<span class="pill">EN ATTENTE</span>`}<br>
        ${esc(q.email)}${q.phone?' · '+esc(q.phone):''}<br>
        <span class="tag">Né(e) le ${esc(fd(q.birth))} · demandé le ${esc(new Date(q.createdAt).toLocaleDateString('fr-FR'))}</span>
        ${q.status==='approved'?`<br>Code : <b style="font-family:ui-monospace,monospace">${esc(q.code)}</b>`:''}
      </div>
      <div class="btns">
        <button class="ghost sm" data-view="${q.id}">Aperçu</button>
        <button class="ghost sm" data-dl="${q.id}">Télécharger</button>
        <button class="ghost sm" data-copy="${q.id}">Copier</button>
        ${q.status==='pending'
          ?`<button class="sm" data-approve="${q.id}">Accepter</button><button class="danger sm" data-reject="${q.id}">Refuser</button>`
          :`<button class="danger sm" data-archive="${q.id}">Archiver</button>`}
      </div>
    </div>`).join(''):'';
}

async function getPhotoBlob(id){
  const r=await api('/api/admin/photo?id='+encodeURIComponent(id));
  if(!r.ok)throw new Error('photo');
  return r.blob();
}
async function dlPhoto(id){
  const q=REQS.find(x=>x.id===id);
  const b=await getPhotoBlob(id);
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;a.download=(q.prenom+'-'+q.nom+'.jpg').replace(/\s+/g,'_');
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
}
async function copyPhoto(id){
  const png=getPhotoBlob(id).then(async b=>{
    const bm=await createImageBitmap(b);
    const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;
    c.getContext('2d').drawImage(bm,0,0);
    return new Promise(res=>c.toBlob(res,'image/png'));
  });
  await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);
}
async function flash(btn,fn,okText){
  const old=btn.textContent;btn.disabled=true;
  try{await fn();btn.textContent=okText;}
  catch{btn.textContent='Échec';}
  setTimeout(()=>{btn.textContent=old;btn.disabled=false;},1600);
}
function openModal(id){
  const q=REQS.find(x=>x.id===id);if(!q)return;
  $('big').src=q.photo;
  $('mdl').dataset.dl=id;$('mcp').dataset.copy=id;
  $('modal').classList.remove('hidden');
}

/* ---------- Clics ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.id==='modal'||t.id==='mcl'){$('modal').classList.add('hidden');return;}
  if(t.dataset.view){openModal(t.dataset.view);return;}
  if(t.dataset.dl){flash(t,()=>dlPhoto(t.dataset.dl),'Téléchargé ✓');return;}
  if(t.dataset.copy){flash(t,()=>copyPhoto(t.dataset.copy),'Copié ✓');return;}

  const id=t.dataset.approve||t.dataset.reject||t.dataset.archive;
  if(id){
    const action=t.dataset.approve?'approve':t.dataset.reject?'reject':'delete';
    if(action==='reject'&&!confirm('Refuser et supprimer cette demande (photo comprise) ?'))return;
    if(action==='delete'&&!confirm('Archiver : la demande et la photo seront supprimées. Continuer ?'))return;
    const r=await api('/api/admin/requests',{method:'POST',body:JSON.stringify({id,action})});
    const d=await r.json();
    if(!r.ok){$('perr').textContent=d.error;return;}
    if(action==='approve')alert('Demande acceptée. Code créé : '+d.code+'\nAjoute maintenant sa carte sur ce code dans la liste ci-dessous.');
    load();
    return;
  }

  if(t.dataset.del){
    if(!confirm('Supprimer le code '+t.dataset.del+' et sa carte ?'))return;
    await api('/api/admin/codes?code='+t.dataset.del,{method:'DELETE'});load();
  }else if(t.dataset.rmf){
    await api('/api/admin/upload?code='+t.dataset.rmf,{method:'DELETE'});load();
  }else if(t.dataset.up){uploadFor=t.dataset.up;$('file').value='';$('file').click();}
});

$('file').onchange=async()=>{
  const f=$('file').files[0];if(!f||!uploadFor)return;
  $('perr').textContent='';
  if(f.size>3*1024*1024){$('perr').textContent='Fichier trop lourd (3 Mo max).';return;}
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
  const r=await api('/api/admin/upload',{method:'POST',body:JSON.stringify({code:uploadFor,filename:f.name,contentType:f.type,data})});
  const d=await r.json();
  if(!r.ok)$('perr').textContent=d.error;
  load();
};

if(PW)load().then(ok=>show(ok));
</script>
</body></html>
