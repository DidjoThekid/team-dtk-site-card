<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demander ma Carte Team DTK</title><link rel="stylesheet" href="/style.css">
</head><body>
<div class="wrap">
  <div class="logo">TEAM DTK</div>

  <div class="card" id="formCard">
    <h1>Demande de carte</h1>
    <p class="sub">Les champs avec * sont obligatoires. Ta demande sera validée par l’équipe.</p>

    <label class="lbl">Adresse e-mail *</label>
    <input id="email" type="email" autocomplete="email" placeholder="toi@exemple.com">

    <label class="lbl">Numéro de téléphone</label>
    <input id="phone" type="tel" autocomplete="tel" placeholder="06 12 34 56 78">

    <label class="lbl">Nom *</label>
    <input id="nom" autocomplete="family-name">

    <label class="lbl">Prénom *</label>
    <input id="prenom" autocomplete="given-name">

    <label class="lbl">Date de naissance * <span class="tag">(entre 2000 et 2017)</span></label>
    <input id="birth" type="date" min="2000-01-01" max="2017-12-31">

    <label class="lbl">Photo de ton visage * <span class="tag">(bonne lumière, visage de face, sans casquette ni lunettes de soleil)</span></label>
    <button type="button" id="openCam" class="ghost">📷 Ouvrir la caméra</button>

    <div id="cam" class="cam hidden">
      <video id="vid" playsinline muted autoplay></video>
      <svg viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true">
        <path fill-rule="evenodd" fill="rgba(0,0,0,.55)" d="M0 0H300V400H0Z M55 185 a95 125 0 1 0 190 0 a95 125 0 1 0 -190 0Z"/>
        <ellipse cx="150" cy="185" rx="95" ry="125" fill="none" stroke="#ffb020" stroke-width="3" stroke-dasharray="8 6"/>
      </svg>
      <div class="hint">Place ton visage dans l’ovale</div>
    </div>
    <button type="button" id="snap" class="hidden">Prendre la photo</button>

    <img id="shot" class="shot hidden" alt="Ta photo">
    <button type="button" id="retake" class="ghost hidden">Reprendre la photo</button>

    <input id="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button id="send">Envoyer ma demande</button>
    <div class="err" id="err"></div>
    <p class="sub" style="margin:14px 0 0;text-align:center"><a href="/" style="color:var(--acc)">← J’ai déjà un code</a></p>
  </div>

  <div class="card profile hidden" id="done">
    <div class="avatar">✓</div>
    <h1>Demande envoyée</h1>
    <p class="sub">L’équipe Team DTK va l’examiner. Une fois acceptée, tu recevras ton code pour télécharger ta carte.</p>
    <a href="/"><button class="ghost">Retour</button></a>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const err=m=>{$('err').textContent=m;};
let photo=null,stream=null;

function stopCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;$('vid').srcObject=null;
}

async function openCam(){
  err('');photo=null;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    return err('Caméra non disponible sur cet appareil ou ce navigateur.');
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:1280}},audio:false
    });
    $('vid').srcObject=stream;
    await $('vid').play().catch(()=>{});
    $('openCam').classList.add('hidden');
    $('shot').classList.add('hidden');$('retake').classList.add('hidden');
    $('cam').classList.remove('hidden');$('snap').classList.remove('hidden');
  }catch{
    err('Impossible d’accéder à la caméra. Autorise-la dans les réglages du navigateur, puis réessaie.');
  }
}

function snap(){
  const v=$('vid');
  if(!v.videoWidth)return err('La caméra n’est pas encore prête, réessaie dans une seconde.');
  // Recadrage centré 3:4 = exactement la zone visible dans le cadre
  const vw=v.videoWidth,vh=v.videoHeight,ratio=3/4;
  let sx=0,sy=0,sw=vw,sh=vh;
  if(vw/vh>ratio){sw=vh*ratio;sx=(vw-sw)/2;}else{sh=vw/ratio;sy=(vh-sh)/2;}
  const c=document.createElement('canvas');c.width=600;c.height=800;
  c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,600,800);
  const url=c.toDataURL('image/jpeg',0.85);
  photo=url.split(',')[1];
  $('shot').src=url;
  stopCam();
  $('cam').classList.add('hidden');$('snap').classList.add('hidden');
  $('shot').classList.remove('hidden');$('retake').classList.remove('hidden');
  err('');
}

$('openCam').onclick=openCam;
$('snap').onclick=snap;
$('retake').onclick=openCam;
window.addEventListener('pagehide',stopCam);

$('send').onclick=async()=>{
  err('');
  const v={email:$('email').value.trim(),phone:$('phone').value.trim(),nom:$('nom').value.trim(),
    prenom:$('prenom').value.trim(),birth:$('birth').value};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email))return err('Adresse e-mail invalide.');
  if(!v.nom)return err('Le nom est requis.');
  if(!v.prenom)return err('Le prénom est requis.');
  if(!v.birth)return err('La date de naissance est requise.');
  if(v.birth<'2000-01-01'||v.birth>'2017-12-31')return err('La date de naissance doit être entre 2000 et 2017.');
  if(!photo)return err('Prends ta photo avec la caméra (champ obligatoire).');

  $('send').disabled=true;$('send').textContent='Envoi…';
  try{
    const r=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...v,photo,photoType:'image/jpeg',website:$('website').value})});
    const d=await r.json();
    if(!r.ok){err(d.error||'Erreur.');return;}

    // Notification e-mail via FormSubmit (n'empêche pas la demande si ça échoue)
    try{
      await fetch('https://formsubmit.co/ajax/team-dtk@outlook.com',{
        method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
        body:JSON.stringify({
          _subject:'Nouvelle demande de Carte Team DTK',_template:'table',_captcha:'false',
          Prénom:v.prenom,Nom:v.nom,Email:v.email,Téléphone:v.phone||'—',Naissance:v.birth,
          Valider_dans_le_panel:location.origin+'/admin.html'
        })
      });
    }catch{}
    stopCam();
    $('formCard').classList.add('hidden');$('done').classList.remove('hidden');
  }catch{err('Connexion impossible.');}
  finally{$('send').disabled=false;$('send').textContent='Envoyer ma demande';}
};
</script>
</body></html>
